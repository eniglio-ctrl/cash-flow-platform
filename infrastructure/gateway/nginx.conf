# API Gateway local. Em produção: AWS API Gateway/ALB + WAF, TLS terminado na borda.
worker_processes auto;
events { worker_connections 4096; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;   # DNS do Docker: acompanha réplicas que sobem/caem

    log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
                                '"status":$status,"upstream":"$upstream_addr","rt":$request_time,'
                                '"urt":"$upstream_response_time","rid":"$request_id"}';
    access_log /dev/stdout json;

    # Rate limit por credencial (token). Excedente recebe 429 em vez de degradar o serviço.
    limit_req_zone $http_authorization zone=per_token_read:10m  rate=200r/s;
    limit_req_zone $http_authorization zone=per_token_write:10m rate=100r/s;
    # Operação administrativa (replay da DLQ): cada chamada move até 1000 mensagens, então o limite é baixo.
    limit_req_zone $http_authorization zone=per_token_admin:1m  rate=1r/s;
    # Emissor de token de desenvolvimento: limitado por IP, já que a chamada não tem credencial.
    limit_req_zone $binary_remote_addr zone=per_ip_dev_token:1m rate=5r/s;
    limit_req_status 429;

    upstream launch {
        zone launch 64k;
        server launch-service:8081 resolve;
        keepalive 32;
    }
    upstream consolidation {
        zone consolidation 64k;
        server consolidation-service:8082 resolve;   # round-robin entre as réplicas
        keepalive 32;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    # Falha numa réplica → tenta a outra (apenas para métodos idempotentes)
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    client_max_body_size 16k;

    server {
        listen 8080;
        add_header X-Request-Id $request_id always;
        add_header X-Content-Type-Options nosniff always;

        location /api/v1/lancamentos {
            limit_req zone=per_token_write burst=50 nodelay;
            proxy_pass http://launch;
        }
        location /api/v1/consolidados {
            limit_req zone=per_token_read burst=100 nodelay;
            proxy_pass http://consolidation;
        }
        location /api/v1/admin/ {
            limit_req zone=per_token_admin burst=2 nodelay;
            # O replay é serializado no serviço e cada execução leva alguns segundos;
            # as chamadas aceitas pelo limite acima podem esperar a anterior terminar.
            proxy_read_timeout 60s;
            proxy_next_upstream off;   # operação não idempotente do ponto de vista do gateway: não repetir em outra réplica
            proxy_pass http://consolidation;
        }
        location = /dev/token {
            limit_req zone=per_ip_dev_token burst=20 nodelay;
            proxy_pass http://launch;
        }
        # Contratos OpenAPI gerados pelos serviços
        location = /openapi/launch.json        { proxy_pass http://launch/v3/api-docs; }
        location = /openapi/consolidation.json { proxy_pass http://consolidation/v3/api-docs; }

        # Swagger UI (mesma origem do gateway: "Try it out" funciona sem CORS)
        location = /swagger { return 301 /swagger/; }
        location /swagger/ {
            set $swagger http://swagger-ui:8080;
            proxy_pass $swagger;
        }

        location = /health {
            return 200 'ok';
        }
    }
}
