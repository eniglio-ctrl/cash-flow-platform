global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: launch-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [launch-service]
        type: A
        port: 8081

  - job_name: consolidation-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:              # descobre todas as réplicas
      - names: [consolidation-service]
        type: A
        port: 8082
