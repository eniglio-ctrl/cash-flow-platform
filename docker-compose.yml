name: cashflow

x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka:9092
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
  TRACING_ENABLED: "true"
  OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash

services:
  # ---------- Contexto: Lançamentos ----------
  launch-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launch
      POSTGRES_USER: launch
      POSTGRES_PASSWORD: launch
    volumes: [launch-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launch -d launch"]
      interval: 5s
      retries: 10

  launch-service:
    build: { context: ., args: { SERVICE: launch-service } }
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://launch-db:5432/launch
      DB_USER: launch
      DB_PASSWORD: launch
    depends_on:
      launch-db: { condition: service_healthy }
    # Sem depends_on no Kafka: o serviço sobe e aceita lançamentos mesmo com o broker fora.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # ---------- Contexto: Consolidação ----------
  consolidation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: consolidation
      POSTGRES_USER: consolidation
      POSTGRES_PASSWORD: consolidation
    volumes: [consolidation-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consolidation -d consolidation"]
      interval: 5s
      retries: 10

  consolidation-service:
    build: { context: ., args: { SERVICE: consolidation-service } }
    deploy:
      replicas: 2   # escala horizontal do caminho de leitura (50 req/s) e do consumo
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://consolidation-db:5432/consolidation
      DB_USER: consolidation
      DB_PASSWORD: consolidation
    depends_on:
      consolidation-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # ---------- Integração ----------
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 15

  # ---------- Borda ----------
  gateway:
    image: nginx:1.28-alpine
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [launch-service, consolidation-service, swagger-ui]
    restart: unless-stopped

  # Documentação interativa das APIs, servida pelo gateway em /swagger/
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /swagger
    volumes:
      # Configuração própria: lista as duas APIs e autoriza sozinha com um token de teste.
      # O log "unable to inject Docker configuration data" é esperado: a configuração vem deste arquivo.
      - ./infrastructure/swagger-ui/swagger-initializer.js:/usr/share/nginx/html/swagger-initializer.js:ro

  # ---------- Observabilidade ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:12.1.1
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports: ["${JAEGER_PORT:-16686}:16686"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ---------- Teste de carga (sob demanda: docker compose --profile loadtest run --rm k6) ----------
  k6:
    image: grafana/k6:1.2.3
    profiles: [loadtest]
    volumes: [./loadtest:/scripts:ro]
    environment:
      BASE_URL: http://gateway:8080
    entrypoint: ["k6", "run", "/scripts/consolidado-50rps.js"]

volumes:
  launch-db:
  consolidation-db:
  kafka-data:
