name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes unitários e de integração (Testcontainers)
        run: mvn -B verify

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack
        run: docker compose up -d --build --wait launch-service consolidation-service gateway
      - name: Cenário de indisponibilidade do consolidado
        run: ./scripts/e2e-resilience.sh
      - name: Teste de carga (50 req/s e 150 req/s)
        run: docker compose --profile loadtest run --rm k6
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=200
